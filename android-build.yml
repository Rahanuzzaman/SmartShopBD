name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/smartshopbd/app
          mkdir -p app/src/main/java/com/smartshopbd/app/data
          mkdir -p app/src/main/res/xml

          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/smartshopbd/app/MainActivity.kt
          mv ShopViewModel.kt app/src/main/java/com/smartshopbd/app/ShopViewModel.kt
          mv ShopDatabase.kt app/src/main/java/com/smartshopbd/app/data/ShopDatabase.kt
          mv file_paths.xml app/src/main/res/xml/file_paths.xml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
